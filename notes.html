<style>
@font-face{font-family:"PartialSansKR";src:url(assets/fonts/PartialSansKR-Regular.woff2) format("woff2");font-display:swap}
:root{--ink:#1E1E1E;--mute:#8b8f97;--line:#ececef;--soft:#f3f4f6;--lime:#CFFF68;--pink:#F8AEDF;--cobalt:#2745A0}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif}
a{color:inherit}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.bar a.brand{display:flex;color:var(--ink);text-decoration:none}
.logo{height:26px;width:auto;display:block}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{text-decoration:none;padding:5px 12px;border-radius:99px;font-size:14px;color:var(--ink)}
nav a:hover,nav a.on{background:var(--lime)}
.bar.has-s{flex-wrap:nowrap;gap:20px}
.bar.has-s .brand{flex:1 1 0}
.bar.has-s nav{flex:1 1 0;justify-content:flex-end}
.sbox{flex:0 1 480px;min-width:0;position:relative}
.sbox input{width:100%;font:inherit;font-size:14px;padding:8px 38px 8px 38px;border:1px solid var(--line);background:var(--soft);border-radius:99px;outline:none}
.sbox input:focus{border-color:var(--cobalt);background:#fff}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mute);pointer-events:none}
.sbox kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px/1 inherit;color:var(--mute);border:1px solid var(--line);background:#fff;border-radius:5px;padding:2px 6px;pointer-events:none}
main{max-width:1400px;margin:0 auto;padding:0 28px}
section{padding:36px 0 24px}
h2{font-family:"PartialSansKR",inherit;font-weight:400;font-size:30px;margin:0 0 6px}
.count{color:var(--mute);font-size:13px}
.chead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:30px 0 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.chead h1{font-size:28px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.chead .cn{color:var(--mute);font-size:16px}
.chead .cdesc{color:var(--mute);font-size:13px;margin-left:auto;text-align:right}
.vt{display:flex;gap:2px;align-self:center;margin-left:8px;background:var(--soft);padding:2px;border-radius:9px}
.vt button{font:inherit;font-size:12px;border:0;background:none;color:var(--mute);padding:4px 10px;border-radius:7px;cursor:pointer}
.vt button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.grid .card{position:relative;display:flex;flex-direction:column;min-width:0;width:100%;padding:0;border:0;text-align:left;font:inherit;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.grid .card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px #cfd1d6,0 4px 14px rgba(0,0,0,.06)}
.grid button.card{cursor:zoom-in}
.thumb{height:104px;background:var(--soft);overflow:hidden;position:relative;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.g .thumb{height:auto;aspect-ratio:4/3}
.g .thumb img{object-position:center}
.cb{display:flex;flex-direction:column;gap:6px;padding:14px 16px 12px;flex:1;min-width:0}
.ch{display:flex;gap:10px;align-items:center;min-width:0}
.fav{flex:none;width:24px;height:24px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden;display:block}
.fav::before{content:attr(data-l);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--cobalt);text-transform:uppercase}
.fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.ct{min-width:0;flex:1}
.t{font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.dom{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:#555;font-size:13px;line-height:1.5;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
.tgs{color:var(--mute);font-size:11px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.arr{flex:none;color:var(--mute);font-size:15px;line-height:1}
.card:hover .arr{color:var(--ink)}
.star{flex:none;color:#e0a100;font-size:14px;line-height:1}
.grid.list{grid-template-columns:1fr;gap:0}
.grid.list .card{flex-direction:row;align-items:center;gap:14px;padding:9px 10px;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line)}
.grid.list .card:hover{transform:none;box-shadow:none;background:var(--soft)}
.grid.list .thumb{display:none}
.grid.list .g .thumb{display:block;width:44px;height:44px;aspect-ratio:auto;border-radius:6px}
.grid.list .cb{display:contents}
.grid.list .ch{flex:0 0 34%}
.grid.list .note{flex:1;-webkit-line-clamp:1}
.grid.list .cf{margin:0;padding:0;flex:0 0 22%;justify-content:flex-end}
.grid.list .g .cb{display:block}
.tagw{font-size:13px}
.tw-sep{height:1px;background:var(--line);margin:8px 4px}
.tw-row{display:flex;align-items:center}
.tw-item{display:flex;width:100%;justify-content:space-between;gap:12px;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;border-radius:99px;padding:6px 12px;cursor:pointer;text-align:left}
.tw-item:hover{background:var(--soft)}
.tw-item.on{background:var(--ink);color:#fff}
.tw-item .n{color:var(--mute);font-size:13px}
.tw-item.on .n{color:#c9ccd2}
.tw-item:focus-visible,.tw-caret:focus-visible{outline:2px solid var(--cobalt);outline-offset:1px}
.tw-caret{flex:none;width:22px;height:22px;margin-right:2px;border:0;background:none;color:var(--mute);cursor:pointer;font-size:10px;border-radius:6px;transition:transform .15s}
.tw-grp.open .tw-caret{transform:rotate(90deg)}
.tw-sub{display:none;padding:2px 0 4px 14px}
.tw-grp.open .tw-sub{display:block}
.tw-sub .tw-item{font-size:13px;padding:4px 12px}
.tw-link{text-decoration:none}
#tagw-sub{display:none}
@media(min-width:761px){
main.has-tagw{display:grid;grid-template-columns:210px minmax(0,1fr);column-gap:32px;align-items:start}
main.has-tagw>*{grid-column:2}
main.has-tagw>.tagw{grid-column:1;grid-row:1/span 6;position:sticky;top:70px;max-height:calc(100vh - 86px);overflow-y:auto;padding:30px 0 12px}
}
@media(max-width:1060px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
.bar.has-s{flex-wrap:wrap;gap:10px}
.bar.has-s .brand,.bar.has-s nav{flex:none}
.bar.has-s nav{margin-left:auto}
.sbox{order:3;flex:1 1 100%}
.sbox kbd{display:none}
.tagw{margin:8px 0 0}
#tagw-list,#tagw-sub{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
#tagw-sub{margin:0}
#tagw-sub:empty{display:none}
.tw-sep,.tw-caret,.tw-sub,.tw-link{display:none!important}
.tw-row{display:contents}
.tw-item,#tagw-sub .tw-item{flex:none;width:auto;gap:6px;background:var(--soft);border-radius:99px;padding:5px 12px;font-size:12px;white-space:nowrap}
#tagw-sub .tw-item{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tw-item.on,#tagw-sub .tw-item.on{background:var(--ink);box-shadow:none}
.chead{padding:16px 0 10px;margin-bottom:14px}
.chead h1{font-size:22px}
.chead .cdesc{display:none}
.grid{grid-template-columns:1fr}
.grid.list .ch{flex:1 1 60%}
.grid.list .note{display:none}
.grid.list .cf{flex:none}
}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;border:0;background:var(--soft);padding:4px 11px;border-radius:99px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.tag{display:inline-block;font-size:11px;background:var(--soft);padding:2px 9px;border-radius:99px;margin:0 4px 4px 0;color:#555}
.badge{display:inline-block;font-size:11px;font-weight:600;background:var(--lime);padding:1px 8px;border-radius:99px;color:var(--ink)}
.card{background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.empty{color:var(--mute);padding:40px 0;text-align:center;background:var(--soft);border-radius:10px}
.none{color:var(--mute);padding:30px 0;display:none}
footer{max-width:1400px;margin:60px auto 0;padding:24px 28px 40px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
#lb{position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:14px}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:72vh;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
#lb .info{max-width:720px;text-align:center}
#lb button{position:absolute;top:16px;right:20px;font-size:28px;background:none;border:0;cursor:pointer;color:var(--ink)}
.lock{max-width:380px;margin:12vh auto;text-align:center}
.lock form{display:flex;gap:8px;margin:18px 0 10px;align-items:stretch}
.lock .btn{white-space:nowrap;min-width:72px;flex:none;box-sizing:border-box}
.lock input[type=password]{flex:1;min-width:0;box-sizing:border-box;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:10px;outline:none}
.lock input:focus{border-color:var(--cobalt)}
.btn{font:inherit;border:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink);padding:6px 14px;font-size:13px}
.err{color:#c0392b;min-height:22px;font-size:14px}
.rem{font-size:13px;color:var(--mute)}
.small{font-size:12px;color:var(--mute);margin-top:22px}
.papers{display:grid;gap:14px;max-width:820px}
.papers .card{padding:16px 18px}
.papers h3{margin:0 0 2px;font-size:17px}
.papers .by{color:var(--mute);font-size:13px;margin-bottom:6px}
.papers a.open{display:inline-block;margin-top:6px;font-size:13px;color:var(--cobalt)}
.ptools{display:grid;gap:10px;margin:0 0 22px;max-width:820px}
.ptools input[type=search]{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:99px;outline:none;width:100%;max-width:340px}
.ptools input:focus{border-color:var(--cobalt)}
.ptools .chip.cat{font-size:13px}
.pgroup{margin:0 0 28px}
.pgroup .cat-h{font-size:19px;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.pgroup .cat-h .n{color:var(--mute);font-size:13px;font-weight:400;margin-left:6px}
.pgroup .plist{display:grid;gap:14px}
.btn.sm{padding:6px 14px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nwrap{max-width:1000px}
.ncards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ncard{display:block;width:100%;text-align:left;font:inherit;color:inherit;padding:16px 18px;border:0;cursor:pointer}
.ncard:hover{transform:translateY(-2px)}
.ncard h3{margin:0 0 2px;font-size:17px;overflow-wrap:anywhere}
.ncard .by,.nwrap .by{color:var(--mute);font-size:13px;margin-bottom:6px}
.ncard .note{margin:4px 0 8px;overflow-wrap:anywhere}
.ntitle{font-size:28px;margin:0 0 6px;overflow-wrap:anywhere}
.md{margin-top:16px;line-height:1.75;overflow-wrap:anywhere}
.md h3{font-size:21px;margin:1.4em 0 .4em}.md h4{font-size:18px;margin:1.3em 0 .4em}.md h5,.md h6{font-size:15px;margin:1.2em 0 .3em}
.md p{margin:.6em 0}.md img{max-width:100%;height:auto;border-radius:8px;display:block}.md a.mdimg{display:inline-block;max-width:100%;margin:.4em 0}
.imgst{color:var(--mute);font-size:13px;align-self:center;margin-left:4px}
.md code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.92em}
.md pre{background:var(--soft);padding:12px 14px;border-radius:8px;overflow:auto}.md pre code{background:none;padding:0}
.md blockquote{margin:.8em 0;padding:2px 14px;border-left:3px solid var(--lime);color:#444;background:#fafafa}
.md a{color:var(--cobalt)}.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.tblw{overflow-x:auto;margin:.8em 0}.md table{border-collapse:collapse;min-width:50%}.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}.md th{background:var(--soft)}
.editor{display:grid;gap:10px}
.editor input[type=text],.editor textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;outline:none;width:100%}
.editor input:focus,.editor textarea:focus{border-color:var(--cobalt)}
.editor textarea{height:60vh;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.6}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pane-prev,.md.pane-prev{margin-top:0;border:1px solid var(--line);border-radius:10px;padding:4px 16px;overflow:auto;height:60vh}
.tabs{display:none;gap:6px}
@media(max-width:760px){.panes{grid-template-columns:1fr}.tabs{display:flex}.editor .pane-prev{display:none}.editor.show-prev .pane-prev{display:block}.editor.show-prev .pane-write{display:none}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:#c0392b}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 10px}.dlg input[type=password]{font:inherit;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin:8px 0 12px}
.guide ol{padding-left:1.3em}.guide li{margin:0 0 12px}.guide .warn{background:var(--soft);border-radius:10px;padding:12px 16px}
[hidden]{display:none!important}
@media(max-width:600px){.bar,main,footer{padding-left:16px;padding-right:16px}.bar{gap:10px}h2{font-size:26px}}

<div class="ovl" id="settings" hidden><div class="dlg" role="dialog" aria-modal="true" aria-label="설정"><h3>설정</h3>

<div class="row"><button class="btn sm" id="tok-save" type="button">저장</button><button class="btn ghost" id="tok-del" type="button">삭제</button><button class="btn ghost" id="tok-check" type="button">연결 확인</button><button class="btn ghost" id="tok-close" type="button">닫기</button></div>
<div class="err" id="tok-status" style="color:var(--ink);margin-top:10px" role="status"></div></div></div>
<script>const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const REPO='inyoung09/archive',FPATH='notes/notes.enc.json',TOK_KEY='archive_gh_token';
const LOCAL=['localhost','127.0.0.1'].includes(location.hostname);
const API=(LOCAL&&localStorage.getItem('archive_api_base'))||'https://api.github.com';
let PW='',notes=[],view='list',cur=null,fTag='',fQ='';
// ---------- crypto (PBKDF2-SHA256 600k -> AES-256-GCM; same format as notes_tool.py) ----------
const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const u2b=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s);};
async function deriveKey(pw,salt,iter,usage){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[usage]);
}
async function decryptRaw(pw,b){
 const key=await deriveKey(pw,b2u(b.salt),b.iter||600000,'decrypt');
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(b.iv)},key,b2u(b.ct));
 return new TextDecoder().decode(pt);
}
async function decryptBlob(pw,b){return JSON.parse(await decryptRaw(pw,b)).notes||[];}
async function encryptNotes(pw,list){
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const key=await deriveKey(pw,salt,600000,'encrypt');
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify({notes:list})));
 return {v:1,kdf:'PBKDF2-SHA256',iter:600000,salt:u2b(salt),iv:u2b(iv),ct:u2b(new Uint8Array(ct))};
}
// ---------- safe markdown ----------
const safeUrl=u=>{u=String(u).trim();if(!u||/[\u0000- \u007f]/.test(u))return null;if(/^https?:\/\//i.test(u))return u;if(/^(\/\/|\\|[a-z][a-z0-9+.\-]*:)/i.test(u))return null;return u;};
// 이미지 src: 상대경로 notes/img/..., https:, blob:, data:image/ 만 허용. IMG = 방금 올린 이미지의 경로 -> blob: URL (Pages 반영 전 미리보기용)
const IMG={};
const imgUrl=u=>{u=String(u).trim();if(!u)return null;if(/^notes\/img\/[\w.\-]+$/.test(u))return IMG[u]||u;if(/^https:\/\/[^\s"'<>]+$/i.test(u)||/^blob:[^\s"'<>]+$/i.test(u)||/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+\/=]+$/i.test(u))return u;return null;};
function emph(t){
 return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[\s(>])__(.+?)__(?=[\s).,!?:;<]|$)/g,'$1<strong>$2</strong>')
  .replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\*([^*\s][^*]*?)\*/g,'<em>$1</em>').replace(/(^|[\s(>])_([^_\s][^_]*?)_(?=[\s).,!?:;<]|$)/g,'$1<em>$2</em>');
}
function inline(t){ // t is already HTML-escaped
 const ph=[];const hold=h=>{ph.push(h);return '\u0000'+(ph.length-1)+'\u0000';};
 t=t.replace(/`([^`]+)`/g,(m,c)=>hold('<code>'+c+'</code>'));
 t=t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^)]*?&quot;)?\)/g,(m,alt,u)=>{const s=imgUrl(u);return hold(s?'<a class="mdimg" href="'+s+'" target="_blank" rel="noopener noreferrer"><img src="'+s+'" alt="'+alt+'" loading="lazy" referrerpolicy="no-referrer"></a>':alt);});
 t=t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^)]*?&quot;)?\)/g,(m,l,u)=>{const s=safeUrl(u);return hold(s?'<a href="'+s+'" target="_blank" rel="noopener noreferrer">'+emph(l)+'</a>':emph(l));});
 t=t.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g,(m,p,u)=>{const tail=(/[.,;:!?)]+$/.exec(u)||[''])[0];const core=u.slice(0,u.length-tail.length);return p+hold('<a href="'+core+'" target="_blank" rel="noopener noreferrer">'+core+'</a>')+tail;});
 t=emph(t);
 let g=0;while(/\u0000\d+\u0000/.test(t)&&g++<10)t=t.replace(/\u0000(\d+)\u0000/g,(m,i)=>ph[+i]);
 return t;
}
const BLOCK_START=l=>/^\s{0,3}(#{1,6}\s|>|(`{3,}|~{3,}))/.test(l)||/^\s*([-*+]|\d+[.)])\s+/.test(l)||/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l);
const SEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
function listBlock(L,i){
 const re=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/;const st=[];let out='';
 while(i<L.length){
  const m=re.exec(L[i]);
  if(!m){
   if(L[i].trim()&&/^\s+\S/.test(L[i])&&st.length){out+='<br>'+inline(esc(L[i].trim()));i++;continue;}
   if(!L[i].trim()&&i+1<L.length&&re.test(L[i+1])){i++;continue;}
   break;}
  const ind=m[1].replace(/\t/g,'    ').length,tag=/\d/.test(m[2][0])?'ol':'ul';
  while(st.length&&ind<st[st.length-1].ind)out+='</li></'+st.pop().tag+'>';
  const top=st[st.length-1];
  if(!top||ind>top.ind){out+='<'+tag+'><li>';st.push({ind,tag});}else out+='</li><li>';
  out+=inline(esc(m[3]));i++;
 }
 while(st.length)out+='</li></'+st.pop().tag+'>';
 return [out,i];
}
function blocks(L){
 let out='',i=0,m;
 while(i<L.length){
  const l=L[i];
  if(!l.trim()){i++;continue;}
  if(m=/^\s{0,3}(`{3,}|~{3,})\s*[\w+-]*\s*$/.exec(l)){
   const f=m[1],buf=[];i++;
   while(i<L.length&&!new RegExp('^\\s{0,3}'+(f[0]==='`'?'`':'~')+'{'+f.length+',}\\s*$').test(L[i]))buf.push(L[i++]);
   i++;out+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';continue;}
  if(m=/^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l)){const n=Math.min(m[1].length+2,6);out+='<h'+n+'>'+inline(esc(m[2]))+'</h'+n+'>';i++;continue;}
  if(/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(l)){out+='<hr>';i++;continue;}
  if(/^\s{0,3}>/.test(l)){const buf=[];while(i<L.length&&/^\s{0,3}>/.test(L[i]))buf.push(L[i++].replace(/^\s{0,3}>\s?/,''));out+='<blockquote>'+blocks(buf)+'</blockquote>';continue;}
  if(l.includes('|')&&i+1<L.length&&SEP.test(L[i+1])&&L[i+1].includes('-')){
   const head=cells(l);i+=2;let rows='';
   while(i<L.length&&L[i].trim()&&L[i].includes('|')){const c=cells(L[i++]);rows+='<tr>'+head.map((_,k)=>'<td>'+inline(esc(c[k]||''))+'</td>').join('')+'</tr>';}
   out+='<div class="tblw"><table><thead><tr>'+head.map(h=>'<th>'+inline(esc(h))+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';continue;}
  if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){const r=listBlock(L,i);out+=r[0];i=r[1];continue;}
  const buf=[l];i++;
  while(i<L.length&&L[i].trim()&&!BLOCK_START(L[i])&&!(L[i].includes('|')&&i+1<L.length&&SEP.test(L[i+1])))buf.push(L[i++]);
  out+='<p>'+buf.map(x=>inline(esc(x.trim()))).join('<br>')+'</p>';
 }
 return out;
}
const md=src=>blocks(String(src||'').replace(/\r\n?/g,'\n').split('\n'));
// ---------- helpers ----------
const todayKR=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
const newId=()=>'n-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const getTok=()=>(localStorage.getItem(TOK_KEY)||'').trim();
const ghH=(tok,extra)=>Object.assign({'Accept':'application/vnd.github+json'},tok?{'Authorization':'Bearer '+tok}:{},extra||{});
let toastT;function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast show'+(err?' bad':'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',err?5000:3500);}
const preview=n=>{const t=String(n.body_md||'').replace(/```[\s\S]*?```/g,' ').replace(/^_\(이미지[^\n]*$/gm,'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/^[#>\-*+\s|:]+/gm,'').replace(/[*_`~]/g,'').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,2).join(' · ');return t.length>130?t.slice(0,130)+'…':t;};
// ---------- GitHub API ----------
async function apiGetFile(){
 const tok=getTok();
 const r=await fetch(API+'/repos/'+REPO+'/contents/'+FPATH+'?ref=main&t='+Date.now(),{headers:ghH(tok),cache:'no-store'});
 if(r.status===404)return null;
 if(!r.ok)throw {status:r.status};
 const j=await r.json();let text;
 if(j.content)text=new TextDecoder().decode(b2u(j.content.replace(/\s/g,'')));
 else{const rr=await fetch(API+'/repos/'+REPO+'/contents/'+FPATH+'?ref=main&t='+Date.now(),{headers:ghH(tok,{'Accept':'application/vnd.github.raw+json'}),cache:'no-store'});if(!rr.ok)throw {status:rr.status};text=await rr.text();}
 return {sha:j.sha,text};
}
function errText(e){
 if(e&&e.pw)return '비밀번호가 달라서 저장할 수 없어요.';
 if(e&&(e.status===401||e.status===403))return '토큰이 올바르지 않거나 권한이 없어요';
 return '저장하지 못했어요. 잠시 후 다시 시도해 주세요.';
}
async function commit(mutate,msg){
 if(!getTok()){openSettings('먼저 GitHub 토큰을 설정해 주세요.');throw {handled:true};}
 for(let at=0;at<2;at++){
  const f=await apiGetFile();
  let remote=[];
  if(f){try{remote=await decryptBlob(PW,JSON.parse(f.text));}catch(_){throw {pw:true};}}
  const merged=mutate(remote);
  const blob=await encryptNotes(PW,merged);
  const body={message:msg,content:u2b(new TextEncoder().encode(JSON.stringify(blob)+'\n')),branch:'main'};
  if(f)body.sha=f.sha;
  const r=await fetch(API+'/repos/'+REPO+'/contents/'+FPATH,{method:'PUT',headers:ghH(getTok(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(r.ok)return merged;
  if((r.status===409||r.status===422)&&at===0)continue;
  throw {status:r.status};
 }
}
async function persist(mutate,msg,after){
 $('#n-save').disabled=true;
 try{notes=await commit(mutate,msg);toast('저장됐어요 (사이트에는 약 1분 뒤 반영돼요)');after();}
 catch(e){if(!(e&&e.handled))toast(errText(e),true);}
 $('#n-save').disabled=false;
}
// ---------- image upload (평문 이미지: notes/img/ 에 바로 커밋) ----------
const IMG_MAX=1600,IMG_WARN=10*1024*1024;
const pad2=n=>String(n).padStart(2,'0');
function imgName(ext){const d=new Date();return ''+d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'-'+pad2(d.getHours())+pad2(d.getMinutes())+pad2(d.getSeconds())+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;}
const toBlob=(cv,type,q)=>new Promise(r=>cv.toBlob(r,type,q));
async function shrinkImage(file){
 const bmp=await createImageBitmap(file);
 const k=Math.min(1,IMG_MAX/Math.max(bmp.width,bmp.height));
 const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bmp.width*k));cv.height=Math.max(1,Math.round(bmp.height*k));
 cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);if(bmp.close)bmp.close();
 let b=await toBlob(cv,'image/webp',0.8),ext='webp';
 if(!b||b.type!=='image/webp'){b=await toBlob(cv,'image/jpeg',0.85);ext='jpg';}
 if(!b)throw new Error('encode');
 return {blob:b,ext};
}
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b);});
async function putImage(name,blob){
 const body={message:'메모 이미지 추가',content:await blobB64(blob),branch:'main'};
 const r=await fetch(API+'/repos/'+REPO+'/contents/notes/img/'+name,{method:'PUT',headers:ghH(getTok(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
 if(!r.ok)throw {status:r.status};
}
function insertAtCursor(text){
 const ta=$('#n-body'),v=ta.value,a=ta.selectionStart==null?v.length:ta.selectionStart,b=ta.selectionEnd==null?a:ta.selectionEnd;
 const pre=a>0&&v[a-1]!=='\n'?'\n':'',post=v[b]===undefined||v[b]==='\n'?'':'\n';
 const ins=pre+text+post+(v[b]===undefined?'\n':'');
 ta.value=v.slice(0,a)+ins+v.slice(b);ta.selectionStart=ta.selectionEnd=a+ins.length;ta.focus();updPrev();
}
let upBusy=0;
async function addImages(files){
 files=[...files];if(!files.length)return;
 if(!getTok()){openSettings('먼저 GitHub 토큰을 설정해 주세요.');return;}
 const st=$('#n-imgst');
 for(const f of files){
  if(!/^image\/(png|jpe?g|gif|webp|bmp|avif)$/i.test(f.type)){toast('이미지 파일만 올릴 수 있어요.',true);continue;}
  upBusy++;$('#n-img').disabled=true;
  st.textContent=(f.size>IMG_WARN?'큰 이미지(10MB 초과)라 줄여서 올려요 · ':'')+'이미지 올리는 중…';
  try{
   const {blob,ext}=await shrinkImage(f),name=imgName(ext);
   await putImage(name,blob);
   const path='notes/img/'+name;IMG[path]=URL.createObjectURL(blob);
   insertAtCursor('![]('+path+')');toast('이미지를 올렸어요 (사이트에는 약 1분 뒤 반영돼요)');
  }catch(e){toast(e&&e.status?errText(e):'이미지를 처리하지 못했어요. 다른 파일로 시도해 주세요.',true);}
  upBusy--;
 }
 if(!upBusy){st.textContent='';$('#n-img').disabled=false;}
}
// ---------- views ----------
function show(v){view=v;$('#nlistv').hidden=v!=='list';$('#nview').hidden=v!=='read';$('#nedit').hidden=v!=='edit';window.scrollTo(0,0);}
const byDate=(a,b)=>(b.updated||'').localeCompare(a.updated||'')||(a.title||'').localeCompare(b.title||'','ko');
function renderList(){
 const all=[...notes].sort(byDate);
 const tc={};all.forEach(n=>(n.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
 if(fTag&&!tc[fTag])fTag='';
 $('#ntags').innerHTML=Object.keys(tc).length?'<button type="button" class="chip'+(fTag?'':' on')+'" data-tag="">전체</button>'+Object.keys(tc).sort((a,b)=>tc[b]-tc[a]||a.localeCompare(b,'ko')).map(t=>'<button type="button" class="chip'+(fTag===t?' on':'')+'" data-tag="'+esc(t)+'">#'+esc(t)+' '+tc[t]+'</button>').join(''):'';
 const q=fQ.toLowerCase();
 const list=all.filter(n=>(!fTag||(n.tags||[]).includes(fTag))&&(!q||[n.title,(n.tags||[]).join(' '),n.body_md].join(' ').toLowerCase().includes(q)));
 $('#ncount').textContent=notes.length?list.length+'개':'';
 $('#nempty').hidden=!!notes.length;
 $('#nnone').hidden=!notes.length||!!list.length;
 $('#nlist').innerHTML=list.map(n=>'<button type="button" class="card ncard" data-id="'+esc(n.id)+'"><h3>'+esc(n.title)+'</h3><div class="by">마지막 수정 '+esc(n.updated||'')+'</div><p class="note">'+esc(preview(n))+'</p>'+(n.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</button>').join('');
}
function openList(){cur=null;renderList();show('list');}
function openRead(id){
 const n=notes.find(x=>x.id===id);if(!n)return openList();cur=n;
 const su=n.source_url&&/^https?:\/\//i.test(n.source_url)?n.source_url:'';
 $('#nread').innerHTML='<h2 class="ntitle">'+esc(n.title)+'</h2><div class="by">마지막 수정 '+esc(n.updated||'')+(su?' · <a href="'+esc(su)+'" target="_blank" rel="noopener noreferrer">노션 원본</a>':'')+'</div><div>'+(n.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div><div class="md">'+md(n.body_md)+'</div>';
 show('read');
}
function openEdit(n){
 cur=n||null;
 $('#n-title').value=n?n.title:'';$('#n-tags').value=n?(n.tags||[]).join(', '):'';$('#n-body').value=n?n.body_md:'';
 $('#n-err').textContent='';$('#nedit').classList.remove('show-prev');setTab(false);updPrev();show('edit');$('#n-title').focus();
}
function updPrev(){$('#n-prev').innerHTML=md($('#n-body').value);}
function setTab(p){$('#nedit').classList.toggle('show-prev',p);$('#tab-write').classList.toggle('on',!p);$('#tab-prev').classList.toggle('on',p);}
async function saveEdit(){
 const title=$('#n-title').value.trim();
 if(!title){$('#n-err').textContent='제목을 입력해 주세요.';return;}
 const tags=[...new Set($('#n-tags').value.split(/[,，]/).map(t=>t.trim()).filter(Boolean))];
 const now=todayKR();
 const n=cur?Object.assign({},cur,{title,tags,body_md:$('#n-body').value,updated:now}):{id:newId(),title,tags,body_md:$('#n-body').value,created:now,updated:now};
 await persist(rem=>{const i=rem.findIndex(x=>x.id===n.id);if(i>=0)rem[i]=n;else rem.push(n);return rem;},'메모 저장: '+n.id,()=>openRead(n.id));
}
async function delNote(){
 if(!cur||!confirm('정말 삭제할까요?'))return;
 const id=cur.id;
 try{notes=await commit(rem=>rem.filter(x=>x.id!==id),'메모 삭제: '+id);toast('삭제했어요 (사이트에는 약 1분 뒤 반영돼요)');openList();}
 catch(e){if(!(e&&e.handled))toast(errText(e),true);}
}
// ---------- settings ----------
function openSettings(msg){$('#tok').value=getTok();$('#tok-status').textContent=msg||(getTok()?'토큰이 저장되어 있어요.':'');$('#settings').hidden=false;$('#tok').focus();}
$('#settings-btn').onclick=()=>openSettings();
$('#tok-close').onclick=()=>$('#settings').hidden=true;
$('#tok-save').onclick=()=>{const v=$('#tok').value.trim();if(!v){$('#tok-status').textContent='토큰을 붙여넣어 주세요.';return;}localStorage.setItem(TOK_KEY,v);$('#tok-status').textContent='저장했어요. ‘연결 확인’을 눌러 보세요.';};
$('#tok-del').onclick=()=>{localStorage.removeItem(TOK_KEY);$('#tok').value='';$('#tok-status').textContent='토큰을 지웠어요.';};
$('#tok-check').onclick=async()=>{
 const tok=$('#tok').value.trim()||getTok();const st=$('#tok-status');
 if(!tok){st.textContent='먼저 토큰을 붙여넣어 주세요.';return;}
 st.textContent='확인 중…';
 try{const r=await fetch(API+'/repos/'+REPO,{headers:ghH(tok),cache:'no-store'});
  if(r.status===401||r.status===403||r.status===404){st.textContent='토큰이 올바르지 않거나 권한이 없어요';return;}
  if(!r.ok){st.textContent='확인하지 못했어요. 잠시 후 다시 시도해 주세요.';return;}
  const j=await r.json();
  st.textContent=j.permissions&&j.permissions.push?'연결됐어요 ✓':'토큰이 올바르지 않거나 권한이 없어요 (Contents 권한을 Read and write로 해 주세요)';
 }catch(_){st.textContent='확인하지 못했어요. 잠시 후 다시 시도해 주세요.';}
};
// ---------- unlock ----------
async function verifyAgainstPapers(pw){
 let enc=null;
 try{const r=await fetch('papers.html?t='+Date.now(),{cache:'no-store'});if(r.ok){const m=/<script type="application\/json" id="enc">(.*?)<\/script>/s.exec(await r.text());if(m)enc=JSON.parse(m[1]);}}catch(_){}
 if(enc)await decryptRaw(pw,enc);
}
async function loadBlob(){
 if(getTok()){try{const f=await apiGetFile();return f?JSON.parse(f.text):null;}catch(_){}}
 const r=await fetch('notes/notes.enc.json?t='+Date.now(),{cache:'no-store'});
 if(r.status===404)return null;

async function unlock(pw,remember,silent){
 const err=$('#err');err.textContent='';
 let blob;
 try{blob=await loadBlob();}catch(_){if(!silent)err.textContent='불러오지 못했어요. 잠시 후 다시 시도해 주세요.';return false;}
 try{notes=blob?await decryptBlob(pw,blob):(await verifyAgainstPapers(pw),[]);}
 catch(_){if(!silent)err.textContent='비밀번호가 맞지 않아요.';return false;}
 PW=pw;sessionStorage.setItem('archive-pw-s',pw);
 if(remember)localStorage.setItem('archive-pw',pw);
 $('#lock').style.display='none';$('#unlocked').style.display='block';openList();
 return true;
}
$('#f').onsubmit=async e=>{e.preventDefault();const pw=$('#pw').value;if(!pw)return;if(await unlock(pw,$('#rem').checked))$('#pw').value='';};

$('#n-body').addEventListener('paste',e=>{const f=[...(e.clipboardData?e.clipboardData.files:[])].filter(x=>x.type.startsWith('image/'));if(f.length){e.preventDefault();addImages(f);}});
