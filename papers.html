<script>
const P=JSON.parse(document.getElementById('enc').textContent);
const $=s=>document.querySelector(s);
const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryOpen(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(P.iv)},key,b2u(P.ct));
 return new TextDecoder().decode(pt);
}
const pf={q:'',theme:null,shown:undefined,busy:false};
const RM=matchMedia('(prefers-reduced-motion: reduce)');
function fit(){document.querySelectorAll('#lv1 .st').forEach(t=>{t.style.fontSize='';if(!t.clientWidth)return;
 let f=parseFloat(getComputedStyle(t).fontSize);while(t.scrollWidth>t.clientWidth&&f>22){f-=1;t.style.fontSize=f+'px';}});}
function reveal(){const ss=[...document.querySelectorAll('#lv1 .strip')];if(RM.matches||!window.IntersectionObserver)return;
 ss.forEach(x=>x.classList.add('pre'));let k=0;
 const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;io.unobserve(en.target);const x=en.target;
  x.style.transitionDelay=Math.min(k++,6)*70+'ms';x.classList.remove('pre');setTimeout(()=>{x.style.transitionDelay='';},1300);}),{threshold:.18});
 ss.forEach(x=>io.observe(x));}
function pApply(){
 const root=$('#content');if(!root.querySelector('#lv1'))return;
 const t=pf.theme;
 root.querySelector('#lv1').hidden=t!==null;
 root.querySelector('#lv2').hidden=t===null;
 if(t===null){pf.shown=null;const sp=root.querySelector('.strips');sp.classList.remove('leaving');sp.querySelectorAll('.pick').forEach(x=>x.classList.remove('pick'));pf.busy=false;fit();return;}
 const anim=t!==pf.shown;pf.shown=t;
 let n=0;
 root.querySelectorAll('.item').forEach(c=>{
  const ok=(!t||c.dataset.cat===t)&&(!pf.q||c.dataset.text.includes(pf.q));
  c.hidden=!ok;if(ok)n++;});
 root.querySelectorAll('#ptabs .tab').forEach(b=>{const on=b.dataset.theme===t;b.classList.toggle('on',on);if(on)b.scrollIntoView({block:'nearest',inline:'nearest'});});
 if(anim){let k=0;root.querySelectorAll('.item').forEach(c=>{c.classList.remove('in');c.style.animationDelay='';
  if(!c.hidden&&!RM.matches){void c.offsetWidth;c.style.animationDelay=Math.min(k++,8)*40+'ms';c.classList.add('in');}});}
 $('#pcount').textContent=n+'개의 자료가 있습니다';
 $('#pnone').style.display=n?'none':'block';
}
function readHash(){
 const m=/^#theme=(.*)$/.exec(location.hash);
 pf.theme=m?decodeURIComponent(m[1]):null;
 if(pf.theme&&!$('#content').querySelector('.tab[data-theme="'+CSS.escape(pf.theme)+'"]'))pf.theme=null;
 pApply();
}
function go(t){const h=t===null?location.pathname+location.search:'#theme='+encodeURIComponent(t);
 if(t===null){history.pushState(null,'',h);readHash();}else{location.hash=h;}}
function pInit(){ // innerHTML doesn't run scripts: wire the injected fragment here via delegation
 pf.q='';
 const root=$('#content');
 root.onclick=e=>{
  const s=e.target.closest('.strip,.tab');if(s){
   if(s.classList.contains('strip')&&!RM.matches){if(pf.busy)return;pf.busy=true;const sp=s.parentNode;s.classList.add('pick');sp.classList.add('leaving');
    setTimeout(()=>{go(s.dataset.theme);scrollTo(0,0);},220);return;}
   go(s.dataset.theme);scrollTo(0,0);return;}
  if(e.target.closest('#pback')){go(null);scrollTo(0,0);return;}
  const it=e.target.closest('.item');if(it&&!e.target.closest('a')){const a=it.querySelector('h3 a');if(a)window.open(a.href,'_blank','noopener');}};
 root.oninput=e=>{if(e.target.id==='pq'){pf.q=e.target.value.trim().toLowerCase();pApply();}};
 window.onhashchange=readHash;
 pf.shown=undefined;pf.busy=false;
 window.onresize=()=>{clearTimeout(pf.rt);pf.rt=setTimeout(fit,120);};
 reveal();
 readHash();
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
}
function show(h){$('#lock').style.display='none';$('#content').innerHTML=h;$('#unlocked').style.display='block';pInit();}
$('#f').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
 const pw=$('#pw').value;if(!pw)return;
 try{const h=await tryOpen(pw);
  if($('#rem').checked)localStorage.setItem('archive-pw',pw);
  sessionStorage.setItem('archive-pw-s',pw);
  show(h);$('#pw').value='';
 }catch(_){$('#err').textContent='비밀번호가 맞지 않아요.';}};
$('#relock').onclick=()=>{localStorage.removeItem('archive-pw');sessionStorage.removeItem('archive-pw-s');$('#content').innerHTML='';$('#content').onclick=null;window.onhashchange=null;$('#content').oninput=null;$('#unlocked').style.display='none';$('#lock').style.display='block';};
(async()=>{const s=sessionStorage.getItem('archive-pw-s')||localStorage.getItem('archive-pw');if(s){try{show(await tryOpen(s));sessionStorage.setItem('archive-pw-s',s);}catch(_){localStorage.removeItem('archive-pw');sessionStorage.removeItem('archive-pw-s');}}})();
</script></body></html>
