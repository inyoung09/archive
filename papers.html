<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex"><title>개인 자료·논문 · 인영 아카이브</title>
<style>
@font-face{font-family:"PartialSansKR";src:url(assets/fonts/PartialSansKR-Regular.woff2) format("woff2");font-display:swap}
:root{--ink:#1E1E1E;--mute:#8b8f97;--line:#ececef;--soft:#f3f4f6;--lime:#CFFF68;--pink:#F8AEDF;--cobalt:#2745A0}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",sans-serif}
a{color:inherit}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.bar a.brand{display:flex;color:var(--ink);text-decoration:none}
.logo{height:26px;width:auto;display:block}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{text-decoration:none;padding:5px 12px;border-radius:99px;font-size:14px;color:var(--ink)}
nav a:hover,nav a.on{background:var(--lime)}
.bar.has-s{flex-wrap:nowrap;gap:20px}
.bar.has-s .brand{flex:1 1 0}
.bar.has-s nav{flex:1 1 0;justify-content:flex-end}
.sbox{flex:0 1 480px;min-width:0;position:relative}
.sbox input{width:100%;font:inherit;font-size:14px;padding:8px 38px 8px 38px;border:1px solid var(--line);background:var(--soft);border-radius:99px;outline:none}
.sbox input:focus{border-color:var(--cobalt);background:#fff}
.sbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mute);pointer-events:none}
.sbox kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:12px/1 inherit;color:var(--mute);border:1px solid var(--line);background:#fff;border-radius:5px;padding:2px 6px;pointer-events:none}
main{max-width:1400px;margin:0 auto;padding:0 28px}
section{padding:36px 0 24px}
h2{font-family:"PartialSansKR",inherit;font-weight:400;font-size:30px;margin:0 0 6px}
.count{color:var(--mute);font-size:13px}
.chead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:30px 0 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.chead h1{font-size:28px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.chead .cn{color:var(--mute);font-size:16px}
.chead .cdesc{color:var(--mute);font-size:13px;margin-left:auto;text-align:right}
.vt{display:flex;gap:2px;align-self:center;margin-left:8px;background:var(--soft);padding:2px;border-radius:9px}
.vt button{font:inherit;font-size:12px;border:0;background:none;color:var(--mute);padding:4px 10px;border-radius:7px;cursor:pointer}
.vt button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.grid .card{position:relative;display:flex;flex-direction:column;min-width:0;width:100%;padding:0;border:0;text-align:left;font:inherit;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.grid .card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px #cfd1d6,0 4px 14px rgba(0,0,0,.06)}
.grid button.card{cursor:zoom-in}
.thumb{height:104px;background:var(--soft);overflow:hidden;position:relative;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.g .thumb{height:auto;aspect-ratio:4/3}
.g .thumb img{object-position:center}
.cb{display:flex;flex-direction:column;gap:6px;padding:14px 16px 12px;flex:1;min-width:0}
.ch{display:flex;gap:10px;align-items:center;min-width:0}
.fav{flex:none;width:24px;height:24px;border-radius:6px;background:var(--soft);position:relative;overflow:hidden;display:block}
.fav::before{content:attr(data-l);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--cobalt);text-transform:uppercase}
.fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.ct{min-width:0;flex:1}
.t{font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.dom{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{color:#555;font-size:13px;line-height:1.5;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cf{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px}
.tgs{color:var(--mute);font-size:11px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.arr{flex:none;color:var(--mute);font-size:15px;line-height:1}
.card:hover .arr{color:var(--ink)}
.star{flex:none;color:#e0a100;font-size:14px;line-height:1}
.grid.list{grid-template-columns:1fr;gap:0}
.grid.list .card{flex-direction:row;align-items:center;gap:14px;padding:9px 10px;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line)}
.grid.list .card:hover{transform:none;box-shadow:none;background:var(--soft)}
.grid.list .thumb{display:none}
.grid.list .g .thumb{display:block;width:44px;height:44px;aspect-ratio:auto;border-radius:6px}
.grid.list .cb{display:contents}
.grid.list .ch{flex:0 0 34%}
.grid.list .note{flex:1;-webkit-line-clamp:1}
.grid.list .cf{margin:0;padding:0;flex:0 0 22%;justify-content:flex-end}
.grid.list .g .cb{display:block}
.tagw{font-size:13px}
.tw-sep{height:1px;background:var(--line);margin:8px 4px}
.tw-row{display:flex;align-items:center}
.tw-item{display:flex;width:100%;justify-content:space-between;gap:12px;font:inherit;font-size:14px;color:var(--ink);background:none;border:0;border-radius:99px;padding:6px 12px;cursor:pointer;text-align:left}
.tw-item:hover{background:var(--soft)}
.tw-item.on{background:var(--ink);color:#fff}
.tw-item .n{color:var(--mute);font-size:13px}
.tw-item.on .n{color:#c9ccd2}
.tw-item:focus-visible,.tw-caret:focus-visible{outline:2px solid var(--cobalt);outline-offset:1px}
.tw-caret{flex:none;width:22px;height:22px;margin-right:2px;border:0;background:none;color:var(--mute);cursor:pointer;font-size:10px;border-radius:6px;transition:transform .15s}
.tw-grp.open .tw-caret{transform:rotate(90deg)}
.tw-sub{display:none;padding:2px 0 4px 14px}
.tw-grp.open .tw-sub{display:block}
.tw-sub .tw-item{font-size:13px;padding:4px 12px}
.tw-link{text-decoration:none}
#tagw-sub{display:none}
@media(min-width:761px){
main.has-tagw{display:grid;grid-template-columns:210px minmax(0,1fr);column-gap:32px;align-items:start}
main.has-tagw>*{grid-column:2}
main.has-tagw>.tagw{grid-column:1;grid-row:1/span 6;position:sticky;top:70px;max-height:calc(100vh - 86px);overflow-y:auto;padding:30px 0 12px}
}
@media(max-width:1060px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
.bar.has-s{flex-wrap:wrap;gap:10px}
.bar.has-s .brand,.bar.has-s nav{flex:none}
.bar.has-s nav{margin-left:auto}
.sbox{order:3;flex:1 1 100%}
.sbox kbd{display:none}
.tagw{margin:8px 0 0}
#tagw-list,#tagw-sub{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
#tagw-sub{margin:0}
#tagw-sub:empty{display:none}
.tw-sep,.tw-caret,.tw-sub,.tw-link{display:none!important}
.tw-row{display:contents}
.tw-item,#tagw-sub .tw-item{flex:none;width:auto;gap:6px;background:var(--soft);border-radius:99px;padding:5px 12px;font-size:12px;white-space:nowrap}
#tagw-sub .tw-item{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.tw-item.on,#tagw-sub .tw-item.on{background:var(--ink);box-shadow:none}
.chead{padding:16px 0 10px;margin-bottom:14px}
.chead h1{font-size:22px}
.chead .cdesc{display:none}
.grid{grid-template-columns:1fr}
.grid.list .ch{flex:1 1 60%}
.grid.list .note{display:none}
.grid.list .cf{flex:none}
}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:12px;border:0;background:var(--soft);padding:4px 11px;border-radius:99px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.tag{display:inline-block;font-size:11px;background:var(--soft);padding:2px 9px;border-radius:99px;margin:0 4px 4px 0;color:#555}
.badge{display:inline-block;font-size:11px;font-weight:600;background:var(--lime);padding:1px 8px;border-radius:99px;color:var(--ink)}
.card{background:#fff;border-radius:12px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.empty{color:var(--mute);padding:40px 0;text-align:center;background:var(--soft);border-radius:10px}
.none{color:var(--mute);padding:30px 0;display:none}
footer{max-width:1400px;margin:60px auto 0;padding:24px 28px 40px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
#lb{position:fixed;inset:0;background:rgba(255,255,255,.96);z-index:50;display:none;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:14px}
#lb.open{display:flex}
#lb img{max-width:100%;max-height:72vh;border-radius:10px;box-shadow:0 2px 14px rgba(0,0,0,.15)}
#lb .info{max-width:720px;text-align:center}
#lb button{position:absolute;top:16px;right:20px;font-size:28px;background:none;border:0;cursor:pointer;color:var(--ink)}
.lock{max-width:380px;margin:12vh auto;text-align:center}
.lock form{display:flex;gap:8px;margin:18px 0 10px;align-items:stretch}
.lock .btn{white-space:nowrap;min-width:72px;flex:none;box-sizing:border-box}
.lock input[type=password]{flex:1;min-width:0;box-sizing:border-box;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:10px;outline:none}
.lock input:focus{border-color:var(--cobalt)}
.btn{font:inherit;border:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink);padding:6px 14px;font-size:13px}
.err{color:#c0392b;min-height:22px;font-size:14px}
.rem{font-size:13px;color:var(--mute)}
.small{font-size:12px;color:var(--mute);margin-top:22px}
.papers{display:grid;gap:14px;max-width:820px}
.papers .card{padding:16px 18px}
.papers h3{margin:0 0 2px;font-size:17px}
.papers .by{color:var(--mute);font-size:13px;margin-bottom:6px}
.papers a.open{display:inline-block;margin-top:6px;font-size:13px;color:var(--cobalt)}
.ptools{display:grid;gap:10px;margin:0 0 22px;max-width:820px}
.ptools input[type=search]{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:99px;outline:none;width:100%;max-width:340px}
.ptools input:focus{border-color:var(--cobalt)}
.ptools .chip.cat{font-size:13px}
.pgroup{margin:0 0 28px}
.pgroup .cat-h{font-size:19px;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.pgroup .cat-h .n{color:var(--mute);font-size:13px;font-weight:400;margin-left:6px}
.pgroup .plist{display:grid;gap:14px}
.btn.sm{padding:6px 14px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nwrap{max-width:1000px}
.ncards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.ncard{display:block;width:100%;text-align:left;font:inherit;color:inherit;padding:16px 18px;border:0;cursor:pointer}
.ncard:hover{transform:translateY(-2px)}
.ncard h3{margin:0 0 2px;font-size:17px;overflow-wrap:anywhere}
.ncard .by,.nwrap .by{color:var(--mute);font-size:13px;margin-bottom:6px}
.ncard .note{margin:4px 0 8px;overflow-wrap:anywhere}
.ntitle{font-size:28px;margin:0 0 6px;overflow-wrap:anywhere}
.md{margin-top:16px;line-height:1.75;overflow-wrap:anywhere}
.md h3{font-size:21px;margin:1.4em 0 .4em}.md h4{font-size:18px;margin:1.3em 0 .4em}.md h5,.md h6{font-size:15px;margin:1.2em 0 .3em}
.md p{margin:.6em 0}.md img{max-width:100%;height:auto;border-radius:8px;display:block}.md a.mdimg{display:inline-block;max-width:100%;margin:.4em 0}
.imgst{color:var(--mute);font-size:13px;align-self:center;margin-left:4px}
.md code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.92em}
.md pre{background:var(--soft);padding:12px 14px;border-radius:8px;overflow:auto}.md pre code{background:none;padding:0}
.md blockquote{margin:.8em 0;padding:2px 14px;border-left:3px solid var(--lime);color:#444;background:#fafafa}
.md a{color:var(--cobalt)}.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.md ul,.md ol{padding-left:1.4em;margin:.5em 0}
.tblw{overflow-x:auto;margin:.8em 0}.md table{border-collapse:collapse;min-width:50%}.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}.md th{background:var(--soft)}
.editor{display:grid;gap:10px}
.editor input[type=text],.editor textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;outline:none;width:100%}
.editor input:focus,.editor textarea:focus{border-color:var(--cobalt)}
.editor textarea{height:60vh;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.6}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pane-prev,.md.pane-prev{margin-top:0;border:1px solid var(--line);border-radius:10px;padding:4px 16px;overflow:auto;height:60vh}
.tabs{display:none;gap:6px}
@media(max-width:760px){.panes{grid-template-columns:1fr}.tabs{display:flex}.editor .pane-prev{display:none}.editor.show-prev .pane-prev{display:block}.editor.show-prev .pane-write{display:none}}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:#c0392b}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 10px}.dlg input[type=password]{font:inherit;width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin:8px 0 12px}
.guide ol{padding-left:1.3em}.guide li{margin:0 0 12px}.guide .warn{background:var(--soft);border-radius:10px;padding:12px 16px}
[hidden]{display:none!important}
@media(max-width:600px){.bar,main,footer{padding-left:16px;padding-right:16px}.bar{gap:10px}h2{font-size:26px}}
</style></head><body>

<script>
const P=JSON.parse(document.getElementById('enc').textContent);
const $=s=>document.querySelector(s);
const b2u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function tryOpen(pw){
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2u(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2u(P.iv)},key,b2u(P.ct));
 return new TextDecoder().decode(pt);
}
const pf={q:'',cat:'',tag:''};
function pApply(){
 const root=$('#content');let any=false;
 root.querySelectorAll('.pgroup').forEach(g=>{
  let n=0;
  g.querySelectorAll('.card').forEach(c=>{
   const tags=JSON.parse(c.dataset.tags||'[]');
   const ok=(!pf.cat||g.dataset.cat===pf.cat)&&(!pf.tag||tags.includes(pf.tag))&&(!pf.q||c.dataset.text.includes(pf.q));
   c.hidden=!ok;if(ok)n++;});
  g.hidden=!n;if(n)any=true;});
 root.querySelectorAll('#pcats .chip').forEach(b=>b.classList.toggle('on',b.dataset.cat===pf.cat));
 root.querySelectorAll('#ptags .chip').forEach(b=>b.classList.toggle('on',b.dataset.tag===pf.tag));
 const nn=$('#pnone');if(nn)nn.style.display=any?'none':'block';
}
function pInit(){ // innerHTML doesn't run scripts: wire the injected fragment here via delegation
 pf.q='';pf.cat='';pf.tag='';
 const root=$('#content');
 root.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
  if('cat' in b.dataset)pf.cat=b.dataset.cat;else if('tag' in b.dataset)pf.tag=b.dataset.tag;else return;pApply();};
 root.oninput=e=>{if(e.target.id==='pq'){pf.q=e.target.value.trim().toLowerCase();pApply();}};
}
function show(h){$('#lock').style.display='none';$('#content').innerHTML=h;$('#unlocked').style.display='block';pInit();}
$('#f').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';
 const pw=$('#pw').value;if(!pw)return;
 try{const h=await tryOpen(pw);
  if($('#rem').checked)localStorage.setItem('archive-pw',pw);
  sessionStorage.setItem('archive-pw-s',pw);
  show(h);$('#pw').value='';
 }catch(_){$('#err').textContent='비밀번호가 맞지 않아요.';}};
$('#relock').onclick=()=>{localStorage.removeItem('archive-pw');sessionStorage.removeItem('archive-pw-s');$('#content').innerHTML='';$('#content').onclick=null;$('#content').oninput=null;$('#unlocked').style.display='none';$('#lock').style.display='block';};
(async()=>{const s=sessionStorage.getItem('archive-pw-s')||localStorage.getItem('archive-pw');if(s){try{show(await tryOpen(s));sessionStorage.setItem('archive-pw-s',s);}catch(_){localStorage.removeItem('archive-pw');sessionStorage.removeItem('archive-pw-s');}}})();
</script></body></html>
